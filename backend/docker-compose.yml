version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: resusensei_postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ResuSenseiDB
      POSTGRES_USER: resusensei
      POSTGRES_PASSWORD: resusensei_password
    networks:
      - resusensei_network

  # FastAPI Application
  api:
    build: .
    container_name: resusensei_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://resusensei:resusensei_password@postgres:5432/resusensei_db
      - DB_NAME=resusensei_db
      - ENVIRONMENT=production
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - resusensei_network

  # Redis (Optional - for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: resusensei_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - resusensei_network

volumes:
  postgresql_data:
  redis_data:

networks:
  resusensei_network:
    driver: bridge